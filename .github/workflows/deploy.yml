name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex and other IndexNow search engines about every URL after each deploy.
  # Google does not support IndexNow; it reads the sitemap through Search Console instead.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          sleep 60
          SITEMAP=$(curl -sf https://mysticrootshealing.org/sitemap.xml)
          URLS=$(echo "$SITEMAP" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | jq -R . | jq -s .)
          BODY=$(jq -n --arg host mysticrootshealing.org --arg key "d642866b6d4b8e7eb9313c9aa4f48a46" --arg keyLocation "https://mysticrootshealing.org/d642866b6d4b8e7eb9313c9aa4f48a46.txt" --argjson urlList "$URLS" '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}')
          curl -s -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
